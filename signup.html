<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PULSE - Sign Up</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #050a12;
            color: white;
        }

        .signup-container {
            width: 90%;
            max-width: 430px;

            background: #0d1624;

            padding: 35px;

            border-radius: 18px;

            border: 1px solid #26364b;

            box-shadow:
                0 0 30px rgba(0, 255, 157, 0.12);

        }

        .logo {
            text-align: center;

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #9eacbd;

            margin-bottom: 30px;
        }

        .signup-container h2 {
            text-align: center;

            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            font-size: 14px;
        }

        .input-group input {
            width: 100%;

            padding: 13px;

            border-radius: 8px;

            border: 1px solid #46566b;

            background: #080f19;

            color: white;

            font-size: 15px;

            outline: none;
        }

        .input-group input:focus {
            border-color: #00ff9d;

            box-shadow:
                0 0 8px rgba(0, 255, 157, 0.2);
        }

        .signup-button {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 9px;

            background: #00b878;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .signup-button:hover {
            background: #00d68f;

            transform: scale(1.02);
        }

        .message {
            text-align: center;

            margin-top: 18px;

            font-weight: bold;

            min-height: 20px;
        }

        .login-link {
            text-align: center;

            margin-top: 22px;

            color: #9eacbd;
        }

        .login-link a {
            color: #00ff9d;

            text-decoration: none;

            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="signup-container">

    <div class="logo">
        🟢 PULSE
    </div>

    <div class="subtitle">
        IoT Smart Ambulance System
    </div>


    <h2>📝 Create Account</h2>


    <!-- USERNAME -->

    <div class="input-group">

        <label for="username">
            👤 Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >

    </div>


    <!-- EMAIL -->

    <div class="input-group">

        <label for="email">
            📧 Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter email address"
        >

    </div>


    <!-- PASSWORD -->

    <div class="input-group">

        <label for="password">
            🔒 Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

    </div>


    <!-- CONFIRM PASSWORD -->

    <div class="input-group">

        <label for="confirmPassword">
            🔒 Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
        >

    </div>


    <!-- SIGN UP BUTTON -->

    <button
        type="button"
        class="signup-button"
        onclick="signupUser()"
    >
        🚀 Create Account
    </button>


    <!-- MESSAGE -->

    <div
        id="signupMessage"
        class="message"
    ></div>


    <!-- LOGIN LINK -->

    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


</div>


<script>

async function signupUser() {

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("signupMessage");


    // ==============================
    // CHECK EMPTY FIELDS
    // ==============================

    if (
        username === "" ||
        email === "" ||
        password === "" ||
        confirmPassword === ""
    ) {

        message.style.color = "#ff5368";

        message.textContent =
            "❌ Please fill all fields.";

        return;
    }


    // ==============================
    // CHECK EMAIL
    // ==============================

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {

        message.style.color = "#ff5368";

        message.textContent =
            "❌ Please enter a valid email.";

        return;
    }


    // ==============================
    // PASSWORD LENGTH
    // ==============================

    if (password.length < 6) {

        message.style.color = "#ff5368";

        message.textContent =
            "❌ Password must be at least 6 characters.";

        return;
    }


    // ==============================
    // PASSWORD MATCH
    // ==============================

    if (password !== confirmPassword) {

        message.style.color = "#ff5368";

        message.textContent =
            "❌ Passwords do not match.";

        return;
    }


    // ==============================
    // SEND DATA TO FASTAPI
    // ==============================

    message.style.color = "#9eacbd";

    message.textContent =
        "⏳ Creating account...";


    try {

        const response = await fetch(
            "https://smart-ambulance-system-3nnp.onrender.com/api/signup",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    username: username,

                    email: email,

                    password: password

                })
            }
        );


        const data =
            await response.json();


        // ==============================
        // SUCCESS
        // ==============================

        if (response.ok && data.status === "SUCCESS") {

            message.style.color = "#00ff9d";

            message.textContent =
                "✅ Account Created Successfully!";

            // Clear fields

            document.getElementById("username").value = "";

            document.getElementById("email").value = "";

            document.getElementById("password").value = "";

            document.getElementById("confirmPassword").value = "";


            // Go to Login page after 1.5 seconds

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);

        }


        // ==============================
        // ERROR
        // ==============================

        else {

            message.style.color = "#ff5368";

            message.textContent =
                "❌ " + (
                    data.message ||
                    "Signup failed."
                );

        }

    }


    catch (error) {

        console.error(
            "Signup Error:",
            error
        );

        message.style.color = "#ff5368";

        message.textContent =
            "❌ Unable to connect to PULSE backend.";

    }

}

</script>


</body>

</html>
