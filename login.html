<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PULSE - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #050a12;
            color: white;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            background: #0d1624;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #26364b;
            box-shadow: 0 0 30px rgba(0, 123, 255, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #9aa8ba;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #46566b;
            background: #080f19;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #007bff;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #21bd81;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1babc4;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .signup-link {
            text-align: center;
            margin-top: 22px;
            color: #9aa8ba;
        }

        .signup-link a {
            color: #00aaff;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            🟢 IoT Smart Ambulance System...
        </div>

        <div class="subtitle">
            Smart Ambulance System
        </div>

        <h2>🔐 Login</h2>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="submit"
                class="login-btn"
            >
                🔐 Login
            </button>

        </form>

        <div id="message"></div>

        <div class="signup-link">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </div>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value.trim();

                const message =
                    document.getElementById("message");


                if (email === "" || password === "") {

                    message.style.color = "#ff5368";

                    message.textContent =
                        "Please enter email and password.";

                    return;
                }


                try {

                    const response = await fetch(
                        "https://smart-ambulance-system-3nnp.onrender.com/api/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (response.ok) {

                        message.style.color = "#00ff9d";

                        message.textContent =
                            "✅ Login Successful!";


                        // Save login status

                        localStorage.setItem(
                            "isLoggedIn",
                            "true"
                        );

                        localStorage.setItem(
                            "userEmail",
                            email
                        );


                        // Open Dashboard

                        

                        setTimeout(function() {

                            window.location.replace("https://smart-ambulance-system-1.onrender.com/dashboard.html");
                            

                        }, 1000);

                    } else {

                        message.style.color = "#ff5368";

                        message.textContent =
                            data.message ||
                            "❌ Invalid email or password.";
                        console.log("Login Error:", data);    

                    }


                } catch (error) {

                    console.error(error);

                    message.style.color = "#ff5368";

                    message.textContent =
                        "❌ Backend connection failed.";

                }

            });

    </script>

</body>
</html>
